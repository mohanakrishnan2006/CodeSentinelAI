server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codesentinel_db}
    username: ${SPRING_DATASOURCE_USERNAME:codesentinel_user}
    password: ${SPRING_DATASOURCE_PASSWORD:codesentinel_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

codesentinel:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    storage-directory: ${CODESENTINEL_UPLOAD_STORAGE_DIRECTORY:${user.home}/.codesentinel/uploads}
    max-archive-size-bytes: 52428800
    max-files: 1000
    max-total-size-bytes: 262144000
    max-file-size-bytes: 52428800
  scan-worker:
    enabled: false
    executor: semgrep
    poll-interval-ms: 1000
    lease-timeout-ms: 300000
    lease-heartbeat-interval-ms: 30000
    execution-timeout-ms: 120000
    docker-command-timeout-ms: 15000
    max-output-bytes: 10485760
    max-source-bytes: 262144000
    memory-limit-bytes: 536870912
    cpu-limit: 1.0
    process-limit: 128
    temporary-memory-bytes: 67108864
    semgrep-image: semgrep/semgrep:1.182.1-nonroot@sha256:0ed16bbbb23e5bf7c442df9144704d74b54ad2d003094e09905130d642f22473
    temporary-directory: ${java.io.tmpdir}/codesentinel-scan-worker
