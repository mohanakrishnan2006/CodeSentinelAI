server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:codesentinel_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

codesentinel:
  ai:
    base-url: http://127.0.0.1:8001
    connect-timeout: 2s
    read-timeout: 130s
    pending-stale-timeout: 6m
    ollama-generation-timeout-seconds: 120
    max-attempts: 3
    model-identifier: qwen2.5-coder:3b
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
  scan-worker:
    executor: placeholder
    lease-heartbeat-interval-ms: 20
