services:
  postgres:
    image: postgres:16-alpine
    container_name: codesentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codesentinel_db}
      POSTGRES_USER: ${POSTGRES_USER:-codesentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codesentinel_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - codesentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codesentinel_user} -d ${POSTGRES_DB:-codesentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codesentinel_pgdata:
    driver: local
